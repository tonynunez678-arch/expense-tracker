{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create an account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input name="username" required minlength="3" maxlength="30" autocomplete="username"
             value="{{ request.form.username }}">
    </label>
    <label>Password <span class="muted">(at least 8 characters)</span>
      <input name="password" type="password" required minlength="8" autocomplete="new-password">
    </label>
    <button type="submit" class="button">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
